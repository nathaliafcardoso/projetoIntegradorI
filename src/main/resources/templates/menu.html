<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu de Gerenciamento de Moradores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      width: 100%;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 36px;
      margin: 0;
    }

    p {
      font-size: 18px;
    }

    .options-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .option-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 200px;
      text-align: center;
      padding: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .option-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .option-card a {
      text-decoration: none;
      color: #4CAF50;
      font-size: 18px;
      font-weight: bold;
      display: block;
      margin-top: 10px;
      padding: 10px;
      border: 2px solid #4CAF50;
      border-radius: 5px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .option-card a:hover {
      background-color: #4CAF50;
      color: white;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      width: 100%;
      position: fixed;
      bottom: 0;
    }
  </style>
</head>
<body>
<header>
  <h1>Bem-vindo ao Sistema de Gestão de Moradores!</h1>
  <p>Escolha uma opção abaixo:</p>
</header>

<div class="options-container">
  <div class="option-card">
    <a href="/moradores/moradorForm">Cadastrar Morador</a>
  </div>
  <div class="option-card">
    <a href="/moradores/editarMorador">Editar Morador</a>
  </div>
  <div class="option-card">
    <a href="/moradores/listarMoradores">Listar Moradores</a>
  </div>
</div>

<footer>
  <p>&copy; 2025 Sistema de Gestão de Moradores</p>
</footer>
</body>
</html>
