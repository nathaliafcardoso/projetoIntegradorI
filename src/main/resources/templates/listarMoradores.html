<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listagem de Moradores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      height: 100vh;
      padding-top: 20px;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      width: 100%;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin: 0;
    }

    /* Botão de voltar ao menu no canto superior direito */
    .menu-link {
      text-decoration: none;
      color: white;
      font-size: 18px;
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #4CAF50;
      padding: 10px 15px;
      border-radius: 5px;
    }

    .menu-link:hover {
      background-color: #45a049;
    }

    .search-container {
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
      margin-left: 20px;
    }

    form {
      background-color: white;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: flex-start;
      gap: 10px;
    }

    label {
      font-size: 18px;
      margin-bottom: 8px;
      display: block;
      text-align: left;
    }

    input[type="text"] {
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      width: 250px;
    }

    input[type="text"]:focus {
      border-color: #4CAF50;
      outline: none;
    }

    button {
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      max-width: 1000px;
      margin: 20px 0;
      border-collapse: collapse;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-left: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    /* Aumentando a largura da coluna Nome */
    .nome-coluna {
      width: 10000px;
    }

    .numeroDaCasa-coluna {
      width: 6000px;
    }


    .action-btn-container {
      display: flex;
      gap: 10px;
    }

    .edit-btn {
      background-color: #FFC107;
      color: black;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }

    .delete-btn {
      background-color: #f44336;
      color: black;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }

  </style>
</head>
<body>

<header>
  <h1>Lista de Moradores</h1>
</header>

<!-- Botão de Voltar ao Menu no canto superior direito -->
<a href="/moradores/menu" class="menu-link">Voltar ao Menu</a>

<!-- Formulário de busca -->
<div class="search-container">
  <form action="/moradores/buscarPorNumeroCasa" method="get">
    <label for="numeroCasa">Buscar por Número da Casa:</label>
    <input type="text" id="numeroCasa" name="numeroCasa" placeholder="Digite o número da casa">
    <button type="submit">Buscar</button>
  </form>
</div>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Número da Casa</th>
    <th>Telefone</th>
    <th>Email</th>
    <th>Ações</th>
  </tr>
  </thead>
  <tbody>
  <!-- Itera sobre a lista de moradores e exibe as informações -->
  <tr th:each="morador : ${moradores}">
    <td th:text="${morador.id}"></td>
    <td class="nome-coluna" th:text="${morador.nome}"></td> <!-- Nome com largura maior -->
    <td class="numeroDaCasa-coluna" th:text="${morador.numeroCasa}"></td>
    <td th:text="${morador.telefone}"></td>
    <td th:text="${morador.email}"></td>
    <td class="action-btn-container">
      <form th:action="@{/moradores/editarMorador/{id}(id=${morador.id})}" method="put" style="display:inline;">
        <button type="submit" class="edit-btn" >Editar</button>
      </form>
      <form th:action="@{/moradores/deletarMorador/{id}(id=${morador.id})}" method="post" style="display:inline;">
        <button type="submit" class="delete-btn" onclick="return confirm('Tem certeza que deseja excluir?')">Deletar</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
